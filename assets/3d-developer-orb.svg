<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Ayush Gupta — 3D developer universe</title>
<desc id="desc">A sleek 3D glass orb with cyan and violet orbital rings and floating technology nodes on a dark background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1b"/><stop offset=".55" stop-color="#10172b"/><stop offset="1" stop-color="#090b18"/></linearGradient>
  <radialGradient id="orb" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#9bf6ff" stop-opacity=".9"/><stop offset=".22" stop-color="#22d3ee" stop-opacity=".52"/><stop offset=".6" stop-color="#6366f1" stop-opacity=".32"/><stop offset="1" stop-color="#151b3b" stop-opacity=".9"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9" stop-opacity=".8"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="orbClip"><circle cx="830" cy="218" r="105"/></clipPath>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<circle cx="830" cy="218" r="150" fill="#4338ca" opacity=".18" filter="url(#blur)"/>
<circle cx="830" cy="218" r="122" fill="#06b6d4" opacity=".10" filter="url(#blur)"/>
<path d="M0 340 C220 260 340 420 540 332 S900 300 1200 355" fill="none" stroke="url(#line)" stroke-width="1"/>
<path d="M0 365 C220 285 340 445 540 357 S900 325 1200 380" fill="none" stroke="url(#line)" stroke-width="1" opacity=".45"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="98" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="4">BUILD • LEARN • SHIP</text>
  <text x="67" y="155" fill="#f8fafc" font-size="42" font-weight="700">Engineering</text>
  <text x="67" y="203" fill="#f8fafc" font-size="42" font-weight="700">the next idea.</text>
  <text x="70" y="244" fill="#a5b4fc" font-size="17">Full-stack · Cloud · Problem solving</text>
  <path d="M70 275 H350" stroke="url(#ring)" stroke-width="2" opacity=".85"/>
  <g font-size="12" font-weight="700">
    <rect x="70" y="300" width="90" height="31" rx="15" fill="#111d32" stroke="#164e63"/><text x="115" y="320" fill="#a5f3fc" text-anchor="middle">MERN</text>
    <rect x="171" y="300" width="90" height="31" rx="15" fill="#111d32" stroke="#4338ca"/><text x="216" y="320" fill="#c4b5fd" text-anchor="middle">AWS</text>
    <rect x="272" y="300" width="110" height="31" rx="15" fill="#111d32" stroke="#6d28d9"/><text x="327" y="320" fill="#ddd6fe" text-anchor="middle">DSA</text>
  </g>
</g>
<!-- Orbital rings create the 3D depth effect -->
<g transform="translate(830 218)" fill="none" stroke="url(#ring)" filter="url(#glow)">
  <ellipse rx="170" ry="58" transform="rotate(-27)" stroke-width="2" opacity=".9"/>
  <ellipse rx="155" ry="76" transform="rotate(38)" stroke-width="1.7" opacity=".75"/>
  <ellipse rx="124" ry="42" transform="rotate(76)" stroke-width="1.3" opacity=".65"/>
</g>
<circle cx="830" cy="218" r="105" fill="url(#orb)" stroke="#a5f3fc" stroke-opacity=".65" stroke-width="1.5"/>
<g clip-path="url(#orbClip)" fill="none" stroke="#a5f3fc" stroke-opacity=".3">
  <ellipse cx="830" cy="218" rx="48" ry="105"/>
  <ellipse cx="830" cy="218" rx="88" ry="105"/>
  <ellipse cx="830" cy="218" rx="105" ry="38"/>
  <ellipse cx="830" cy="218" rx="105" ry="72"/>
  <path d="M720 218 H940 M830 108 V328"/>
</g>
<circle cx="796" cy="177" r="22" fill="#e0f2fe" opacity=".35" filter="url(#blur)"/>
<circle cx="796" cy="177" r="8" fill="#ecfeff" opacity=".85"/>
<g filter="url(#glow)">
  <circle cx="680" cy="145" r="7" fill="#67e8f9"/><circle cx="978" cy="174" r="6" fill="#c4b5fd"/>
  <circle cx="889" cy="93" r="5" fill="#a5f3fc"/><circle cx="944" cy="302" r="7" fill="#818cf8"/>
  <circle cx="720" cy="304" r="5" fill="#c4b5fd"/><circle cx="1024" cy="250" r="4" fill="#67e8f9"/>
</g>
<g font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#cbd5e1">
  <text x="1002" y="142">CLOUD</text><text x="904" y="75">CODE</text><text x="965" y="328">CREATE</text>
</g>
<path d="M35 30 H1165 M35 400 H1165" stroke="#334155" stroke-opacity=".55"/>
<circle cx="1148" cy="52" r="3" fill="#22d3ee"/><circle cx="1160" cy="52" r="3" fill="#818cf8"/>
</svg>